services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: asad
      POSTGRES_PASSWORD: asad
      POSTGRES_DB: asad
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asad -d asad"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
