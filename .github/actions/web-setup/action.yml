name: Web setup
description: Node, the web app's packages, optionally the built site and Playwright browsers.

inputs:
  site:
    description: Name of the built-site artifact to put in web/dist (empty for none)
    default: ""
  browser:
    description: Playwright browser to install (chromium, firefox, webkit, all, or none)
    default: none

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        package-manager-cache: false
    - name: Install packages
      shell: bash
      working-directory: web
      run: npm ci
    - if: inputs.site != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.site }}
        path: web/dist
    - name: Install the browser
      if: inputs.browser != 'none'
      shell: bash
      working-directory: web
      env:
        BROWSER: ${{ inputs.browser }}
      run: |
        if [ "$BROWSER" = all ]; then
          npx playwright install --with-deps chromium firefox webkit
        else
          npx playwright install --with-deps "$BROWSER"
        fi
