name: Deploy

# Called by CI after the pipeline, web and parity jobs pass.
#   pull request -> a preview at https://pr-<number>.<project>.pages.dev
#   main         -> production (the live demo)
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_call:
    inputs:
      branch:
        description: Cloudflare Pages branch ("main" is production; anything else is a preview)
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
    outputs:
      url:
        description: URL of this deployment
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

env:
  PAGES_PROJECT: amazon-seller-analytics-demo
  # The custom domain, set up in the Cloudflare dashboard (Pages project > Custom domains).
  PRODUCTION_URL: https://demo.manitechnology.com

jobs:
  deploy:
    name: Build, smoke test, deploy (${{ inputs.branch }})
    runs-on: ubuntu-latest
    concurrency:
      group: pages-${{ inputs.branch }}
      cancel-in-progress: ${{ inputs.branch != 'main' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asad
          POSTGRES_PASSWORD: asad
          POSTGRES_DB: asad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asad -d asad"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://asad:asad@localhost:5432/asad
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: make install
      - name: Build data (generate, load, models, export)
        run: make data
      - name: Build the site
        working-directory: web
        run: npm run build

      - name: Install Chromium, Firefox and WebKit for the smoke test
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Smoke test the build
        working-directory: web
        run: npm run smoke

      - name: Create the Pages project if it does not exist
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -q "$PAGES_PROJECT"; then
            echo "Project $PAGES_PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: web
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=${{ inputs.branch }} --commit-dirty=true

      - name: Smoke test the deployed site
        working-directory: web
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Checking $SMOKE_BASE_URL"
          # A new deployment (and, the first time, a new pages.dev address and its certificate)
          # can take a few minutes to answer, so wait for it before checking.
          curl -sS -o /dev/null --retry 30 --retry-delay 10 --retry-all-errors --max-time 15 \
            --fail "$SMOKE_BASE_URL/"
          for path in / /data/manifest.json /inventory /products/does-not-exist; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 "$SMOKE_BASE_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          npm run smoke

      - name: Smoke test the custom domain (production only)
        if: inputs.branch == 'main'
        working-directory: web
        env:
          SMOKE_BASE_URL: ${{ env.PRODUCTION_URL }}
        run: |
          # The custom domain serves the newest production deployment once Cloudflare has
          # switched over; wait until it serves this build's data before checking it.
          expected=$(python3 -c "import json;print(json.load(open('dist/data/manifest.json'))['generatedAt'])")
          for i in $(seq 1 30); do
            live=$(curl -sS --max-time 15 "$SMOKE_BASE_URL/data/manifest.json" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['generatedAt'])" || true)
            [ "$live" = "$expected" ] && break
            echo "Waiting for $SMOKE_BASE_URL to serve this build ($live != $expected)"
            sleep 10
          done
          test "$live" = "$expected"
          for path in / /data/manifest.json /inventory /products/does-not-exist; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 "$SMOKE_BASE_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          npm run smoke

      - name: Summary
        run: |
          {
            echo "### Deployed (${{ inputs.branch }})"
            echo ""
            echo "- This deployment: ${{ steps.deploy.outputs.deployment-url }}"
            echo "- Branch alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
            if [ "${{ inputs.branch }}" = "main" ]; then echo "- Live demo: $PRODUCTION_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
