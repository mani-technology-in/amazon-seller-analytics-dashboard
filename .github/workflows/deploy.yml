name: Deploy

# Called by CI after the pipeline, web, parity and security jobs pass.
#   pull request -> a preview at https://pr-<number>.<project>.pages.dev
#   main         -> production (the live demo)
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_call:
    inputs:
      branch:
        description: Cloudflare Pages branch ("main" is production; anything else is a preview)
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
    outputs:
      url:
        description: URL of this deployment
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

env:
  PAGES_PROJECT: amazon-seller-analytics-demo
  # The custom domain, set up in the Cloudflare dashboard (Pages project > Custom domains).
  PRODUCTION_URL: https://demo.manitechnology.com
  # The Wrangler command line, pinned (replaces cloudflare/wrangler-action, which runs on Node 20).
  WRANGLER: wrangler@4.141.0

jobs:
  deploy:
    name: Build, smoke test, deploy (${{ inputs.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: pages-${{ inputs.branch }}
      cancel-in-progress: ${{ inputs.branch != 'main' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asad
          POSTGRES_PASSWORD: asad
          POSTGRES_DB: asad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asad -d asad"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://asad:asad@localhost:5432/asad
      PAGES_BRANCH: ${{ inputs.branch }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: false # this job publishes the site, so it never restores a cache
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: make install
      - name: Build data (generate, load, models, export)
        run: make data
      - name: Build the site
        working-directory: web
        run: npm run build

      - name: Install Chromium, Firefox and WebKit for the smoke test
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Smoke test the build
        working-directory: web
        run: npm run smoke

      - name: Create the Pages project if it does not exist
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes "$WRANGLER" pages project list | grep -q "$PAGES_PROJECT"; then
            echo "Project $PAGES_PROJECT exists"
          else
            npx --yes "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" pages deploy dist --project-name="$PAGES_PROJECT" \
            --branch="$PAGES_BRANCH" --commit-dirty=true | tee deploy.log
          # Wrangler prints this deployment's own URL first, then the branch alias (if any).
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | head -1)"
          alias="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | sed -n 2p)"
          if [ -z "$url" ]; then echo "::error::No pages.dev URL in the deploy output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Smoke test the deployed site
        working-directory: web
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Checking $SMOKE_BASE_URL"
          # A new deployment (and, the first time, a new pages.dev address and its certificate)
          # can take a few minutes to answer, so wait for it before checking.
          curl -sS -o /dev/null --retry 30 --retry-delay 10 --retry-all-errors --max-time 15 \
            --fail "$SMOKE_BASE_URL/"
          for path in / /data/manifest.json /inventory /products/does-not-exist; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 "$SMOKE_BASE_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          npm run smoke

      - name: Smoke test the custom domain (production only)
        if: inputs.branch == 'main'
        working-directory: web
        env:
          SMOKE_BASE_URL: ${{ env.PRODUCTION_URL }}
        run: |
          # The custom domain serves the newest production deployment once Cloudflare has
          # switched over; wait until it serves this build's data before checking it.
          expected=$(python3 -c "import json;print(json.load(open('dist/data/manifest.json'))['generatedAt'])")
          for i in $(seq 1 30); do
            live=$(curl -sS --max-time 15 "$SMOKE_BASE_URL/data/manifest.json" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['generatedAt'])" || true)
            [ "$live" = "$expected" ] && break
            echo "Waiting for $SMOKE_BASE_URL to serve this build ($live != $expected)"
            sleep 10
          done
          test "$live" = "$expected"
          for path in / /data/manifest.json /inventory /products/does-not-exist; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 "$SMOKE_BASE_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          # Security headers on the real domain (NFR-SEC-1).
          headers="$(curl -sSI --max-time 15 "$SMOKE_BASE_URL/")"
          for h in content-security-policy strict-transport-security x-content-type-options referrer-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "::error::Missing header $h"; exit 1; }
          done
          npm run smoke

      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias }}
        run: |
          {
            echo "### Deployed ($PAGES_BRANCH)"
            echo ""
            echo "- This deployment: $DEPLOY_URL"
            if [ -n "$ALIAS_URL" ]; then echo "- Branch alias: $ALIAS_URL"; fi
            if [ "$PAGES_BRANCH" = "main" ]; then echo "- Live demo: $PRODUCTION_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
