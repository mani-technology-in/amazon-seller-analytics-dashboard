name: Deploy

# Called by CI after the pipeline, web, parity and security jobs pass.
#
# The checks run as separate jobs, side by side, and each one runs to the end even when another
# fails, so one run shows every problem at once (lesson from PR #35, which needed 7 runs because
# each failing step hid the next):
#
#   build ─┬─ smoke (chromium | firefox | webkit) ─┐
#          └──────────────────────────────────────── deploy ─┬─ live smoke (3 browsers)
#                                                            ├─ lighthouse  (previews)
#                                                            ├─ zap         (previews)
#                                                            └─ production  (main)
#   report: one table of every job's result; fails if any job failed.
#
# Production is only deployed when the smoke tests pass; a preview is deployed anyway, so the
# checks after it still run and report.
#   pull request -> a preview at https://pr-<number>.<project>.pages.dev
#   main         -> production (the live demo)
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_call:
    inputs:
      branch:
        description: Cloudflare Pages branch ("main" is production; anything else is a preview)
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
    outputs:
      url:
        description: URL of this deployment
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

env:
  PAGES_PROJECT: amazon-seller-analytics-demo
  # The custom domain, set up in the Cloudflare dashboard (Pages project > Custom domains).
  PRODUCTION_URL: https://demo.manitechnology.com
  # The Wrangler command line, pinned (replaces cloudflare/wrangler-action, which runs on Node 20).
  WRANGLER: wrangler@4.141.0
  # Tools run with npx or Docker, pinned
  LHCI: "@lhci/cli@0.15.1"
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

jobs:
  build:
    name: Build data and site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asad
          POSTGRES_PASSWORD: asad
          POSTGRES_DB: asad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asad -d asad"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://asad:asad@localhost:5432/asad
      # PostHog project key (public by design; a repository variable, not in the code). Empty
      # means analytics is off; the build does not fail.
      VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false # this workflow publishes the site, so it never restores a cache
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: make install
      - name: Build data (generate, load, models, export)
        run: make data
      - name: Build the site
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ inputs.branch }}-${{ github.run_attempt }}
          path: web/dist/
          retention-days: 3
          if-no-files-found: error

  smoke:
    name: Smoke test the build (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # every browser reports, even when another fails
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium --project=android
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit --project=iphone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/web-setup
        with:
          site: site-${{ inputs.branch }}-${{ github.run_attempt }}
          browser: ${{ matrix.browser }}
      - name: Smoke test
        working-directory: web
        env:
          PROJECTS: ${{ matrix.projects }}
        # PROJECTS is a fixed list from the matrix above, split into arguments on purpose
        run: npm run smoke -- $PROJECTS --output=test-results/build
      - uses: ./.github/actions/smoke-traces
        if: always()
        with:
          name: traces-build-${{ matrix.browser }}-${{ inputs.branch }}-${{ github.run_attempt }}

  deploy:
    name: Deploy (${{ inputs.branch }})
    needs: [build, smoke]
    # Production only after every smoke test passed; previews deploy anyway so the checks
    # after this still run.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (inputs.branch != 'main' || needs.smoke.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-${{ inputs.branch }}
      cancel-in-progress: ${{ inputs.branch != 'main' }}
    env:
      PAGES_BRANCH: ${{ inputs.branch }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      alias: ${{ steps.deploy.outputs.alias }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ inputs.branch }}-${{ github.run_attempt }}
          path: dist
      - name: Create the Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes "$WRANGLER" pages project list | grep -q "$PAGES_PROJECT"; then
            echo "Project $PAGES_PROJECT exists"
          else
            npx --yes "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch=main
          fi
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler.ndjson"
          npx --yes "$WRANGLER" pages deploy dist --project-name="$PAGES_PROJECT" \
            --branch="$PAGES_BRANCH" --commit-dirty=true
          # Wrangler's machine-readable record of the deployment (the same one wrangler-action reads).
          record="$(jq -c 'select(.type == "pages-deploy-detailed")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -1)"
          url="$(echo "$record" | jq -r '.url // empty')"
          if [ -z "$url" ]; then echo "::error::No deployment URL in Wrangler's output file"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=$(echo "$record" | jq -r '.alias // empty')" >> "$GITHUB_OUTPUT"
      - name: Wait until the deployment answers
        env:
          SITE: ${{ steps.deploy.outputs.url }}
        run: |
          # A new deployment (and, the first time, a new pages.dev address and its certificate)
          # can take a few minutes to answer.
          curl -sS -o /dev/null --retry 30 --retry-delay 10 --retry-all-errors --max-time 15 \
            --fail "$SITE/"
          for path in / /data/manifest.json /inventory /products/does-not-exist; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 "$SITE$path")
            echo "$path -> $code"
            test "$code" = "200"
          done

  live-smoke:
    name: Smoke test the deployed site (${{ matrix.browser }})
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium --project=android
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit --project=iphone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/web-setup
        with:
          browser: ${{ matrix.browser }}
      - name: Smoke test
        working-directory: web
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.url }}
          PROJECTS: ${{ matrix.projects }}
        run: npm run smoke -- $PROJECTS --output=test-results/preview
      - uses: ./.github/actions/smoke-traces
        if: always()
        with:
          name: traces-live-${{ matrix.browser }}-${{ inputs.branch }}-${{ github.run_attempt }}

  # Speed and accessibility of every page on the preview, as a phone on a slow 4G connection
  # (Lighthouse's simulation), median of 3 runs. Budgets in web/lighthouserc.json: only the
  # figures that are stable from run to run fail the check; LCP is reported (it varied from
  # 2.5 s to 5.1 s for the same page on CI) and tracked weekly in lighthouse-weekly.yml.
  lighthouse:
    name: Lighthouse
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && inputs.branch != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Lighthouse
        working-directory: web
        env:
          SITE: ${{ needs.deploy.outputs.url }}
        run: |
          set +e
          npx --yes "$LHCI" autorun \
            --collect.url="$SITE/" --collect.url="$SITE/sales" --collect.url="$SITE/inventory" \
            --collect.url="$SITE/advertising" --collect.url="$SITE/profit" --collect.url="$SITE/reports"
          status=$?
          node e2e/lighthouse-summary.mjs
          exit $status

  # OWASP ZAP baseline: a passive scan of the preview (spider plus header and content checks,
  # no attacks). Any alert of medium risk or higher fails the job.
  zap:
    name: ZAP baseline scan
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && inputs.branch != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scan
        env:
          SITE: ${{ needs.deploy.outputs.url }}
        run: |
          mkdir -p zap && chmod 777 zap
          docker pull -q "$ZAP_IMAGE"
          echo "ZAP image: $(docker image inspect --format '{{index .RepoDigests 0}}' "$ZAP_IMAGE")"
          # -I: warnings do not fail the scan itself; the risk check below decides
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$SITE" -J zap.json -r zap.html -I || true
          test -s zap/zap.json
          jq -r '.site[].alerts[] | "\(.riskdesc)\t\(.alert)\t\(.count) instances"' zap/zap.json \
            | sort | tee zap/alerts.txt
          # each medium-or-higher alert, with its first URL and evidence, as an annotation
          jq -r '.site[].alerts[] | select((.riskcode | tonumber) >= 2)
            | "::warning title=ZAP \(.riskdesc)::\(.alert) (plugin \(.pluginid)): \(.instances[0].uri) \(.instances[0].evidence // "")"' \
            zap/zap.json
          {
            echo "### ZAP baseline scan"
            echo ""
            if [ -s zap/alerts.txt ]; then
              echo '| Risk | Alert | Count |'
              echo '| --- | --- | --- |'
              sed 's/\t/ | /g; s/^/| /; s/$/ |/' zap/alerts.txt
            else
              echo "No alerts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          high=$(jq '[.site[].alerts[] | select((.riskcode | tonumber) >= 2)] | length' zap/zap.json)
          if [ "$high" -gt 0 ]; then
            echo "::error title=ZAP::$high alert(s) of medium risk or higher, see the job summary"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-${{ inputs.branch }}-${{ github.run_attempt }}
          path: zap/
          retention-days: 14
          if-no-files-found: ignore

  production:
    name: Check the custom domain (production)
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && inputs.branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/web-setup
        with:
          site: site-${{ inputs.branch }}-${{ github.run_attempt }}
          browser: all
      - name: Smoke test the custom domain
        working-directory: web
        env:
          SMOKE_BASE_URL: ${{ env.PRODUCTION_URL }}
        run: |
          # The custom domain serves the newest production deployment once Cloudflare has
          # switched over; wait until it serves this build's data before checking it.
          expected=$(python3 -c "import json;print(json.load(open('dist/data/manifest.json'))['generatedAt'])")
          for i in $(seq 1 30); do
            curl -sS --max-time 15 -o live-manifest.json "$SMOKE_BASE_URL/data/manifest.json" || true
            live=$(python3 -c "import json;print(json.load(open('live-manifest.json'))['generatedAt'])" || true)
            [ "$live" = "$expected" ] && break
            echo "Waiting for $SMOKE_BASE_URL to serve this build ($live != $expected)"
            sleep 10
          done
          test "$live" = "$expected"
          for path in / /data/manifest.json /inventory /products/does-not-exist; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 "$SMOKE_BASE_URL$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          # The smoke test also checks the security headers on this domain (NFR-SEC-1).
          npm run smoke -- --output=test-results/production
      - uses: ./.github/actions/smoke-traces
        if: always()
        with:
          name: traces-production-${{ github.run_attempt }}

  report:
    name: Deploy checks
    needs: [build, smoke, deploy, live-smoke, lighthouse, zap, production]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Results of every check
        env:
          RESULTS: ${{ toJSON(needs) }}
          BRANCH: ${{ inputs.branch }}
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
          ALIAS_URL: ${{ needs.deploy.outputs.alias }}
        run: |
          {
            echo "### Deploy checks ($BRANCH)"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
            echo ""
            if [ -n "$DEPLOY_URL" ]; then echo "- This deployment: $DEPLOY_URL"; fi
            if [ -n "$ALIAS_URL" ]; then echo "- Branch alias: $ALIAS_URL"; fi
            if [ "$BRANCH" = "main" ]; then echo "- Live demo: $PRODUCTION_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error title=Deploy checks::failed: $failed"
            exit 1
          fi
