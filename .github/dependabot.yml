# Weekly update pull requests for the web app, the Python pipeline and the CI actions.
# Minor and patch updates are grouped so there is one pull request per area each week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7 # let new releases settle a week before proposing them
    commit-message:
      prefix: chore
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions that break the build today; upgrade by hand when ready.
      # TypeScript 7: typescript-eslint 8 supports TypeScript below 6.1 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # TanStack Table 9: a new API (no useReactTable); the tables stay on v8 by design.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7 # let new releases settle a week before proposing them
    commit-message:
      prefix: chore
    groups:
      pipeline-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7 # let new releases settle a week before proposing them
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
